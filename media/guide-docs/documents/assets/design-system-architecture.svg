<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1500" viewBox="0 0 1180 1500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475467"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:700;fill:#101828}
      .sub{font-size:15px;fill:#667085}
      .secTitle{font-size:19px;font-weight:700;fill:#fff}
      .boxTitle{font-size:16px;font-weight:700;fill:#101828}
      .boxDesc{font-size:13px;fill:#475467}
      .mono{font-family:'Consolas','D2Coding',monospace;font-size:12.5px;fill:#344054}
      .monoSm{font-family:'Consolas','D2Coding',monospace;font-size:11.5px;fill:#667085}
      .tag{font-size:12px;font-weight:700}
      .step{font-size:13px;font-weight:700;fill:#fff}
    </style>
  </defs>

  <rect width="1180" height="1500" fill="#f8fafc"/>

  <!-- Header -->
  <text x="40" y="50" class="title">react-app-scaffold · 공통 디자인 시스템 구조</text>
  <text x="40" y="78" class="sub">어느 프로젝트에 투입되어도 동일하게 동작하는 토큰 → 테마 → 컴포넌트 파이프라인 (Style Dictionary + Tailwind v4 + shadcn/ui)</text>

  <!-- ============ STAGE 1 : SOURCE TOKENS ============ -->
  <g>
    <rect x="40" y="110" width="1100" height="190" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="40" y="110" width="240" height="32" rx="12" fill="#4f46e5"/>
    <rect x="40" y="126" width="240" height="16" fill="#4f46e5"/>
    <text x="56" y="132" class="secTitle">① 토큰 원본 (Source)</text>
    <text x="296" y="132" class="monoSm" fill="#6366f1">src/design-tokens/  · DTCG JSON · 사람이 편집</text>

    <!-- primitive -->
    <rect x="64" y="160" width="330" height="120" rx="10" fill="#fff" stroke="#c7d2fe"/>
    <text x="84" y="186" class="boxTitle">primitive/</text>
    <text x="84" y="208" class="boxDesc">원시 값 (브랜드 무관 팔레트·스케일)</text>
    <text x="84" y="232" class="mono">color.json  ·  spacing.json</text>
    <text x="84" y="252" class="mono">typography.json  ·  shadow.json</text>
    <text x="84" y="272" class="monoSm">예) color.brand.500 = #6259ca</text>

    <!-- semantic -->
    <rect x="424" y="160" width="330" height="120" rx="10" fill="#fff" stroke="#c7d2fe"/>
    <text x="444" y="186" class="boxTitle">semantic/</text>
    <text x="444" y="208" class="boxDesc">의미 기반 토큰 (primitive 참조)</text>
    <text x="444" y="232" class="mono">light.json  ·  dark.json</text>
    <text x="444" y="256" class="monoSm">예) primary = var(--color-brand-500)</text>
    <text x="444" y="274" class="monoSm">status.active = var(--color-emerald-500)</text>

    <!-- config -->
    <rect x="784" y="160" width="332" height="120" rx="10" fill="#fff" stroke="#c7d2fe"/>
    <text x="804" y="186" class="boxTitle">style-dictionary.config.js</text>
    <text x="804" y="208" class="boxDesc">빌드 규칙 (4 platforms)</text>
    <text x="804" y="232" class="mono">css_primitive → @theme</text>
    <text x="804" y="252" class="mono">css_light → :root</text>
    <text x="804" y="272" class="mono">css_dark → .dark · ts → d.ts</text>
  </g>

  <!-- arrow + build -->
  <line x1="590" y1="300" x2="590" y2="340" stroke="#475467" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="312" width="320" height="30" rx="15" fill="#111827"/>
  <text x="590" y="332" class="step" text-anchor="middle">npm run build:tokens  (Style Dictionary)</text>

  <!-- ============ STAGE 2 : GENERATED ============ -->
  <g>
    <rect x="40" y="362" width="1100" height="170" rx="12" fill="#fef3f2" stroke="#fecdca"/>
    <rect x="40" y="362" width="410" height="32" rx="12" fill="#d92d20"/>
    <rect x="40" y="378" width="410" height="16" fill="#d92d20"/>
    <text x="56" y="384" class="secTitle">② 생성물 (Generated) ⚠ 편집 금지</text>
    <text x="466" y="384" class="monoSm" fill="#d92d20">src/assets/styles/tokens/  · 자동 출력</text>

    <rect x="64" y="412" width="250" height="100" rx="10" fill="#fff" stroke="#fecdca"/>
    <text x="84" y="438" class="boxTitle">primitive.css</text>
    <text x="84" y="462" class="mono">@theme { --color-brand-500 }</text>
    <text x="84" y="484" class="boxDesc">Tailwind 유틸 생성용</text>
    <text x="84" y="503" class="monoSm">→ bg-brand-500 등 자동</text>

    <rect x="334" y="412" width="250" height="100" rx="10" fill="#fff" stroke="#fecdca"/>
    <text x="354" y="438" class="boxTitle">theme-light.css</text>
    <text x="354" y="462" class="mono">:root { --primary ... }</text>
    <text x="354" y="486" class="boxDesc">라이트 시맨틱 변수</text>

    <rect x="604" y="412" width="250" height="100" rx="10" fill="#fff" stroke="#fecdca"/>
    <text x="624" y="438" class="boxTitle">theme-dark.css</text>
    <text x="624" y="462" class="mono">.dark { --primary ... }</text>
    <text x="624" y="486" class="boxDesc">다크 시맨틱 변수</text>

    <rect x="874" y="412" width="242" height="100" rx="10" fill="#fff" stroke="#fecdca"/>
    <text x="894" y="438" class="boxTitle">types.d.ts</text>
    <text x="894" y="462" class="mono">design-tokens/types.d.ts</text>
    <text x="894" y="486" class="boxDesc">TS 자동완성·타입</text>
  </g>

  <line x1="590" y1="532" x2="590" y2="568" stroke="#475467" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 3 : THEME BRIDGE ============ -->
  <g>
    <rect x="40" y="572" width="1100" height="150" rx="12" fill="#ecfdf3" stroke="#a6f4c5"/>
    <rect x="40" y="572" width="300" height="32" rx="12" fill="#039855"/>
    <rect x="40" y="588" width="300" height="16" fill="#039855"/>
    <text x="56" y="594" class="secTitle">③ 테마 / 브랜드 브리지</text>
    <text x="356" y="594" class="monoSm" fill="#039855">src/assets/styles/themes/  · 프로젝트별 교체 지점</text>

    <rect x="64" y="622" width="510" height="84" rx="10" fill="#fff" stroke="#a6f4c5"/>
    <text x="84" y="648" class="boxTitle">theme-default.css  (기본 템플릿)</text>
    <text x="84" y="672" class="boxDesc">shadcn 시맨틱 vars(:root/.dark) +</text>
    <text x="84" y="692" class="mono">@theme inline → Tailwind 유틸 연결 브리지</text>

    <rect x="594" y="622" width="522" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="614" y="648" class="boxTitle">theme-peoplify.css  (현재 활성 브랜드) ★</text>
    <text x="614" y="672" class="boxDesc">default 복사 → 브랜드 색으로 override</text>
    <text x="614" y="692" class="mono">app.css 에서 이 파일만 교체하면 리브랜딩 완료</text>
  </g>

  <line x1="590" y1="722" x2="590" y2="758" stroke="#475467" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 4 : app.css entry ============ -->
  <g>
    <rect x="40" y="762" width="1100" height="270" rx="12" fill="#fffaeb" stroke="#fedf89"/>
    <rect x="40" y="762" width="470" height="32" rx="12" fill="#dc6803"/>
    <rect x="40" y="778" width="470" height="16" fill="#dc6803"/>
    <text x="56" y="784" class="secTitle">④ 진입점 app.css  (@import 순서 = 우선순위)</text>
    <text x="526" y="784" class="monoSm" fill="#dc6803">src/assets/styles/app.css · 선언 없이 import만</text>

    <!-- ordered list -->
    <g class="mono">
      <rect x="64" y="808" width="1052" height="26" rx="6" fill="#fff7e6"/>
      <text x="80" y="826">1. External    Tailwind v4 · tw-animate-css · shadcn/tailwind.css · 폰트(Outfit, Geist)</text>
      <rect x="64" y="840" width="1052" height="26" rx="6" fill="#fff"/>
      <text x="80" y="858">2. Tokens      tokens/primitive.css · theme-light.css · theme-dark.css   (자동생성)</text>
      <rect x="64" y="872" width="1052" height="26" rx="6" fill="#fff7e6"/>
      <text x="80" y="890">3. Theme       themes/theme-peoplify.css   (브랜드 브리지)</text>
      <rect x="64" y="904" width="1052" height="26" rx="6" fill="#fff"/>
      <text x="80" y="922">4. Base        base/reset.css · typography.css · layout.css · utilities.css</text>
      <rect x="64" y="936" width="1052" height="26" rx="6" fill="#fff7e6"/>
      <text x="80" y="954">5. Layout      layout/default/layout.css   (서드파티 오버라이드만)</text>
      <rect x="64" y="968" width="1052" height="26" rx="6" fill="#fff"/>
      <text x="80" y="986">+  @custom-variant dark (&amp;:is(.dark *))   ← 반드시 루트에 직접 선언</text>
    </g>
    <text x="80" y="1018" class="boxDesc">base/utilities.css 의 @utility(menu-item 등)와 @theme 변수가 합쳐져 Tailwind 유틸리티 클래스로 컴파일됨</text>
  </g>

  <line x1="590" y1="1032" x2="590" y2="1068" stroke="#475467" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 5 : Components ============ -->
  <g>
    <rect x="40" y="1072" width="1100" height="200" rx="12" fill="#eff8ff" stroke="#b2ddff"/>
    <rect x="40" y="1072" width="300" height="32" rx="12" fill="#1570ef"/>
    <rect x="40" y="1088" width="300" height="16" fill="#1570ef"/>
    <text x="56" y="1094" class="secTitle">⑤ 컴포넌트 레이어</text>
    <text x="356" y="1094" class="monoSm" fill="#1570ef">src/shared/lib/shadcn/  · components.json(CLI)</text>

    <rect x="64" y="1122" width="510" height="130" rx="10" fill="#fff" stroke="#b2ddff"/>
    <text x="84" y="1148" class="boxTitle">shadcn/ui/  (원본 UI 컴포넌트)</text>
    <text x="84" y="1170" class="boxDesc">button · input · select · table · card · calendar …</text>
    <text x="84" y="1192" class="mono">ui/index.ts 한 곳에서 export 관리</text>
    <text x="84" y="1216" class="boxDesc">스타일은 시맨틱 변수(bg-primary 등) 참조 →</text>
    <text x="84" y="1236" class="boxDesc">테마만 바꿔도 컴포넌트가 자동 리브랜딩</text>

    <rect x="594" y="1122" width="522" height="130" rx="10" fill="#fff" stroke="#b2ddff"/>
    <text x="614" y="1148" class="boxTitle">유틸 · 설정</text>
    <text x="614" y="1172" class="mono">shared/utils/cn.ts</text>
    <text x="614" y="1192" class="boxDesc">clsx + tailwind-merge (클래스 병합)</text>
    <text x="614" y="1218" class="mono">components.json</text>
    <text x="614" y="1238" class="boxDesc">shadcn CLI · style:radix-nova · alias 매핑</text>
  </g>

  <line x1="590" y1="1272" x2="590" y2="1308" stroke="#475467" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="340" y="1312" width="500" height="46" rx="23" fill="#101828"/>
  <text x="590" y="1341" class="step" font-size="16" text-anchor="middle">화면 (domains / publishing 업무 페이지)</text>

  <!-- legend -->
  <g>
    <text x="40" y="1400" class="boxTitle">투입 시 변경 지점 (요약)</text>
    <text x="40" y="1426" class="boxDesc">• 색/스케일 변경 → design-tokens/*.json 수정 후 <tspan class="mono">npm run build:tokens</tspan></text>
    <text x="40" y="1448" class="boxDesc">• 브랜드 교체 → themes/theme-[project].css 작성 후 app.css 의 ③ import 한 줄 교체</text>
    <text x="40" y="1470" class="boxDesc">• 컴포넌트 추가 → shadcn CLI 설치 후 ui/index.ts 에 export 추가  (tokens/ 폴더는 절대 직접 편집 금지)</text>
  </g>
</svg>

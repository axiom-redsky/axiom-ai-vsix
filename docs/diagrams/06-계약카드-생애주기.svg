<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" font-family="Malgun Gothic, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8FAADC"/>
    </marker>
  </defs>
  <rect width="1440" height="810" fill="#FFFFFF"/>

  <!-- 헤더 -->
  <circle cx="62" cy="58" r="26" fill="#1F3864"/>
  <text x="62" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="106" y="54" font-size="28" font-weight="bold" fill="#1F3864">계약 카드의 생애 — 카드 1장이 지시·검증·제어를 모두 관장한다</text>
  <text x="106" y="86" font-size="15" fill="#595959">저작(컴파일 타임) → 전수 판정(런타임) → 3갈래 사용 → 4개 경로 공유 — 검색은 어디에도 없다</text>

  <!-- 관계 배지 -->
  <rect x="1040" y="26" width="350" height="60" rx="8" fill="#FFF9EC" stroke="#C55A11" stroke-width="1.5"/>
  <text x="1215" y="51" text-anchor="middle" font-size="13" font-weight="bold" fill="#C55A11">🔍 03-규약-자동주입.svg의 후속 —</text>
  <text x="1215" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#C55A11">카드 1장이 어디까지 쓰이는가</text>

  <line x1="50" y1="116" x2="1390" y2="116" stroke="#D9E2F3" stroke-width="2"/>

  <!-- A: 저작 (컴파일 타임) -->
  <rect x="50" y="150" width="360" height="286" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
  <rect x="272" y="160" width="120" height="26" rx="13" fill="#A6A6A6"/>
  <text x="332" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">컴파일 타임</text>
  <text x="72" y="198" font-size="16" font-weight="bold" fill="#333333">0단계 — 카드 저작 (개발자)</text>
  <text x="72" y="224" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/ai/ScaffoldContracts.ts L130</text>
  <rect x="70" y="238" width="320" height="150" rx="8" fill="#1E2430"/>
  <text x="86" y="264" font-family="Consolas, monospace" font-size="11.5" fill="#D8DEE9">{ id: 'use-api',</text>
  <text x="86" y="290" font-family="Consolas, monospace" font-size="11.5" fill="#D8DEE9">  applies: (ctx) =&gt; …, <tspan fill="#7FB77E">// 발동 조건</tspan></text>
  <text x="86" y="316" font-family="Consolas, monospace" font-size="11.5" fill="#E8A87C">  card: `⛔ refetch()…`, <tspan fill="#7FB77E">// 정답지</tspan></text>
  <text x="86" y="342" font-family="Consolas, monospace" font-size="11.5" fill="#D8DEE9">  replacesRegionRootWith, <tspan fill="#7FB77E">// 게이트</tspan></text>
  <text x="86" y="368" font-family="Consolas, monospace" font-size="11.5" fill="#D8DEE9">  requiresPatchMode }    <tspan fill="#7FB77E">// 모드</tspan></text>
  <text x="72" y="418" font-size="12" font-weight="bold" fill="#2E5395">정답지가 코드에 내장 — 뒤질 저장소 없음</text>

  <line x1="410" y1="293" x2="453" y2="293" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- B: 런타임 전수 판정 -->
  <rect x="460" y="150" width="330" height="286" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="702" y="160" width="78" height="26" rx="13" fill="#2E5395"/>
  <text x="741" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="482" y="198" font-size="16" font-weight="bold" fill="#1F3864">1단계 — 런타임 전수 판정</text>
  <text x="482" y="224" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/ai/ScaffoldContracts.ts</text>
  <text x="482" y="248" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2E5395">selectScaffoldContracts() L401</text>
  <text x="482" y="280" font-size="12.5" fill="#595959">사용자 요청 도착 → 재료 구성:</text>
  <text x="482" y="304" font-family="Consolas, monospace" font-size="12.5" fill="#595959">{ deps, region, query }</text>
  <text x="482" y="334" font-size="12.5" fill="#595959">카드 11장을 전부 순회하며</text>
  <text x="482" y="358" font-size="12.5" fill="#595959">applies(ctx) 참/거짓만 확인</text>
  <rect x="482" y="378" width="286" height="34" rx="6" fill="#FFFFFF" stroke="#2E5395"/>
  <text x="625" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5395">검색 아님 · 임베딩 없음 — 조건 판정뿐</text>

  <!-- 팬아웃 화살표 -->
  <line x1="790" y1="220" x2="853" y2="196" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="790" y1="293" x2="853" y2="293" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="790" y1="366" x2="853" y2="390" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- C1: 지시 -->
  <rect x="860" y="150" width="530" height="90" rx="10" fill="#FDF0E7" stroke="#C55A11" stroke-width="2"/>
  <rect x="1272" y="160" width="100" height="24" rx="12" fill="#C55A11"/>
  <text x="1322" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">sLLM에게 전달</text>
  <text x="884" y="182" font-size="14.5" font-weight="bold" fill="#C55A11">① 지시 — 프롬프트 주입</text>
  <text x="884" y="206" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#C55A11">buildContractSection() L434</text>
  <text x="884" y="228" font-size="12" fill="#595959">발동 카드를 "## react-app-scaffold 계약" 섹션으로 조각 생성 프롬프트에 첨부</text>

  <!-- C2: 검증 -->
  <rect x="860" y="248" width="530" height="90" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="1294" y="258" width="78" height="24" rx="12" fill="#2E5395"/>
  <text x="1333" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="884" y="280" font-size="14.5" font-weight="bold" fill="#1F3864">② 검증 — 게이트 화이트리스트</text>
  <text x="884" y="304" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#2E5395">componentReplacementTargets() L416 → checkRegionRootTag() L927</text>
  <text x="884" y="326" font-size="12" fill="#595959">카드가 허용한 교체(예: SmartTable)만 통과 — 그 외 루트 변경은 거부</text>

  <!-- C3: 제어 -->
  <rect x="860" y="346" width="530" height="90" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="1294" y="356" width="78" height="24" rx="12" fill="#2E5395"/>
  <text x="1333" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="884" y="378" font-size="14.5" font-weight="bold" fill="#1F3864">③ 제어 — 편집 모드 결정</text>
  <text x="884" y="402" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#2E5395">contractsRequirePatchMode() L426</text>
  <text x="884" y="424" font-size="12" fill="#595959">JSX 렌더가 필요한 카드 발동 시 structural 모드 제외 (반쪽 편집 예방)</text>

  <!-- SSoT 배너 -->
  <rect x="50" y="458" width="1340" height="54" rx="10" fill="#1F3864"/>
  <text x="720" y="492" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#FFFFFF">하나의 카드 = 지시(프롬프트)·검증(게이트)·제어(모드)의 공통 진실원 — 시키는 것과 검사하는 것이 어긋날 수 없다</text>

  <!-- 4개 경로 -->
  <text x="50" y="550" font-size="14.5" font-weight="bold" fill="#1F3864">같은 카드 로직을 공유하는 4개 경로 (전부 실제 호출 지점)</text>
  <rect x="50" y="564" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#D9E2F3" stroke-width="2"/>
  <text x="72" y="596" font-size="13.5" font-weight="bold" fill="#1F3864">영역 편집 (주 경로)</text>
  <text x="72" y="620" font-family="Consolas, monospace" font-size="11" fill="#2E5395">RegionEditService.ts L353</text>
  <text x="72" y="644" font-size="11.5" fill="#595959">buildHybridPrompt 조립 중 주입</text>

  <rect x="390" y="564" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#D9E2F3" stroke-width="2"/>
  <text x="412" y="596" font-size="13.5" font-weight="bold" fill="#1F3864">full 폴백 재주입</text>
  <text x="412" y="620" font-family="Consolas, monospace" font-size="11" fill="#2E5395">ChatViewProvider.ts L4988</text>
  <text x="412" y="644" font-size="11.5" fill="#595959">폴백 시 계약 유실(생짜 fetch 회귀) 방지</text>

  <rect x="730" y="564" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#D9E2F3" stroke-width="2"/>
  <text x="752" y="596" font-size="13.5" font-weight="bold" fill="#1F3864">파일 생성 · 시나리오 C</text>
  <text x="752" y="620" font-family="Consolas, monospace" font-size="11" fill="#2E5395">ScaffoldContextBuilder.ts L649</text>
  <text x="752" y="644" font-size="11.5" fill="#595959">새 파일 생성 프롬프트에도 동일 카드</text>

  <rect x="1070" y="564" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#D9E2F3" stroke-width="2"/>
  <text x="1092" y="596" font-size="13.5" font-weight="bold" fill="#1F3864">오프라인 응답</text>
  <text x="1092" y="620" font-family="Consolas, monospace" font-size="11" fill="#2E5395">OfflineResponder.ts L102</text>
  <text x="1092" y="644" font-size="11.5" fill="#595959">모델 없이도 카드로 사용법 안내</text>

  <!-- 실체 확인 푸터 -->
  <rect x="50" y="686" width="1340" height="96" rx="10" fill="#EAF4EB" stroke="#2E7D32" stroke-width="2"/>
  <text x="78" y="714" font-size="15" font-weight="bold" fill="#2E7D32">실체 확인</text>
  <text x="78" y="738" font-size="13" fill="#333333">· 함수 5종 전부 ScaffoldContracts.ts 실존: SCAFFOLD_CONTRACTS L130 · selectScaffoldContracts L401 · componentReplacementTargets L416 · contractsRequirePatchMode L426 · buildContractSection L434</text>
  <text x="78" y="762" font-size="13" fill="#333333">· 게이트 연동: checkRegionRootTag (RegionEdit.ts L927)가 동일 카드의 화이트리스트를 사용 — npm run test:region-edit 220건으로 상시 검증</text>
</svg>

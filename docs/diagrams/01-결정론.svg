<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" font-family="Malgun Gothic, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8FAADC"/>
    </marker>
  </defs>
  <rect width="1440" height="810" fill="#FFFFFF"/>

  <!-- 헤더 -->
  <circle cx="62" cy="58" r="26" fill="#1F3864"/>
  <text x="62" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="106" y="54" font-size="28" font-weight="bold" fill="#1F3864">결정론 — 편집 요청 한 건이 통과하는 8단계 흐름</text>
  <text x="106" y="86" font-size="15" fill="#595959">파란 칸 = 일반 코드(같은 입력이면 항상 같은 결과) · 주황 칸 = sLLM(틀릴 수 있음) — 확률은 전체 중 단 한 칸</text>

  <!-- 범례 -->
  <rect x="1040" y="22" width="350" height="78" rx="8" fill="#FFFFFF" stroke="#D9E2F3" stroke-width="2"/>
  <rect x="1058" y="36" width="26" height="18" rx="4" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <text x="1094" y="51" font-size="13" fill="#333333">결정론 (일반 코드) — 절대 안 틀림</text>
  <rect x="1058" y="68" width="26" height="18" rx="4" fill="#FDF0E7" stroke="#C55A11" stroke-width="2"/>
  <text x="1094" y="83" font-size="13" fill="#333333">확률 (sLLM) — 틀릴 수 있음 → 뒤에서 검증</text>

  <line x1="50" y1="116" x2="1390" y2="116" stroke="#D9E2F3" stroke-width="2"/>

  <!-- ══ 1행 (왼→오) ══ -->
  <!-- 1. 사용자 요청 -->
  <rect x="60" y="150" width="280" height="180" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
  <rect x="252" y="160" width="78" height="26" rx="13" fill="#A6A6A6"/>
  <text x="291" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">입력</text>
  <text x="80" y="196" font-size="16" font-weight="bold" fill="#333333">사용자 요청</text>
  <text x="80" y="240" font-size="13.5" fill="#595959">"테이블에 부서 컬럼</text>
  <text x="80" y="264" font-size="13.5" fill="#595959">추가해줘"</text>
  <text x="80" y="294" font-size="12.5" fill="#8C8C8C">(VSCode 채팅 입력)</text>
  <line x1="340" y1="240" x2="403" y2="240" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 2. 구조 분해 -->
  <rect x="410" y="150" width="280" height="180" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="602" y="160" width="78" height="26" rx="13" fill="#2E5395"/>
  <text x="641" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="430" y="196" font-size="16" font-weight="bold" fill="#1F3864">① 구조 분해</text>
  <text x="430" y="222" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/ai/CodeSectionExtractor.ts</text>
  <text x="430" y="246" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2E5395">splitTsSections()  L108</text>
  <text x="430" y="276" font-size="12.5" fill="#595959">파일을 import·훅·JSX 등</text>
  <text x="430" y="298" font-size="12.5" fill="#595959">선언 단위로 쪼갠다</text>
  <line x1="690" y1="240" x2="753" y2="240" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 3. 위치 탐색 -->
  <rect x="760" y="150" width="280" height="180" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="952" y="160" width="78" height="26" rx="13" fill="#2E5395"/>
  <text x="991" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="780" y="196" font-size="16" font-weight="bold" fill="#1F3864">② 위치 탐색</text>
  <text x="780" y="222" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/ai/RegionEdit.ts</text>
  <text x="780" y="246" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2E5395">locateEditRegion()  L556</text>
  <text x="780" y="274" font-size="12.5" fill="#595959">요청문을 단어(토큰)로 쪼개</text>
  <text x="780" y="296" font-size="12.5" fill="#595959">줄마다 포함 개수를 점수화</text>
  <text x="780" y="318" font-size="12.5" fill="#595959">→ 최고점 줄의 JSX 블록 확정</text>
  <line x1="1040" y1="240" x2="1103" y2="240" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 4. 계약 주입 -->
  <rect x="1110" y="150" width="280" height="180" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="1302" y="160" width="78" height="26" rx="13" fill="#2E5395"/>
  <text x="1341" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="1130" y="196" font-size="16" font-weight="bold" fill="#1F3864">③ 계약 주입</text>
  <text x="1130" y="222" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/ai/ScaffoldContracts.ts</text>
  <text x="1130" y="246" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2E5395">buildContractSection() L434</text>
  <text x="1130" y="274" font-size="12.5" fill="#595959">scaffold 내장 기능(useApi·</text>
  <text x="1130" y="296" font-size="12.5" fill="#595959">$router·$ui…) 사용법</text>
  <text x="1130" y="318" font-size="12.5" fill="#595959">"정답지"를 프롬프트에 첨부</text>

  <!-- 행 전환 화살표 -->
  <line x1="1250" y1="330" x2="1250" y2="398" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ══ 2행 (오→왼) ══ -->
  <!-- 5. 조각 생성 (sLLM) -->
  <rect x="1110" y="405" width="280" height="180" rx="10" fill="#FDF0E7" stroke="#C55A11" stroke-width="3"/>
  <rect x="1302" y="415" width="78" height="26" rx="13" fill="#C55A11"/>
  <text x="1341" y="433" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">확률</text>
  <text x="1130" y="451" font-size="16" font-weight="bold" fill="#C55A11">④ 조각 생성 — sLLM</text>
  <text x="1130" y="477" font-size="11.5" fill="#8C8C8C">(폐쇄망 사내 LLM 서버 호출)</text>
  <text x="1130" y="501" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#C55A11">await callModel(prompt)</text>
  <text x="1130" y="529" font-size="12.5" fill="#595959">코드 조각 하나만 생성 —</text>
  <text x="1130" y="551" font-size="12.5" font-weight="bold" fill="#C55A11">전체 8단계 중 유일한 모델 단계</text>
  <line x1="1110" y1="495" x2="1047" y2="495" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 6. 게이트 검증 -->
  <rect x="760" y="405" width="280" height="180" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="952" y="415" width="78" height="26" rx="13" fill="#2E5395"/>
  <text x="991" y="433" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="780" y="451" font-size="16" font-weight="bold" fill="#1F3864">⑤ 게이트 검증</text>
  <text x="780" y="477" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/ai/RegionEditService.ts</text>
  <text x="780" y="501" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2E5395">runHybridRegionEdit() L471</text>
  <text x="780" y="527" font-size="12.5" font-weight="bold" fill="#B02B2B">불합격 → 즉시 거부 (원본 무손상)</text>
  <text x="780" y="549" font-size="12.5" fill="#595959">폴백 분기(되묻기·재요청·full):</text>
  <text x="780" y="571" font-family="Consolas, monospace" font-size="11" fill="#2E5395">classifyRegionDecline()  L82</text>
  <line x1="760" y1="495" x2="697" y2="495" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 7. 컴파일러 검증 -->
  <rect x="410" y="405" width="280" height="180" rx="10" fill="#F2F6FC" stroke="#2E5395" stroke-width="2"/>
  <rect x="602" y="415" width="78" height="26" rx="13" fill="#2E5395"/>
  <text x="641" y="433" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="430" y="451" font-size="16" font-weight="bold" fill="#1F3864">⑥ 컴파일러 검증</text>
  <text x="430" y="477" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/providers/ChatViewProvider.ts</text>
  <text x="430" y="501" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#2E5395">_verifyTextByDiagnostics() L3198</text>
  <text x="430" y="527" font-size="12.5" fill="#595959">임시 파일로 TS 타입검사 →</text>
  <text x="430" y="549" font-size="12.5" fill="#595959">새 에러 시 1회 교정 지시:</text>
  <text x="430" y="571" font-family="Consolas, monospace" font-size="11" fill="#2E5395">buildVerifyCorrectionPrompt() L147</text>
  <line x1="410" y1="495" x2="347" y2="495" stroke="#8FAADC" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 8. 병합·적용 -->
  <rect x="60" y="405" width="280" height="180" rx="10" fill="#EAF4EB" stroke="#2E7D32" stroke-width="2"/>
  <rect x="252" y="415" width="78" height="26" rx="13" fill="#2E7D32"/>
  <text x="291" y="433" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">결정론</text>
  <text x="80" y="451" font-size="16" font-weight="bold" fill="#2E7D32">⑦ 병합·적용 완료</text>
  <text x="80" y="477" font-family="Consolas, monospace" font-size="11" fill="#7A8CA8">src/ai/StructuralAnchor.ts</text>
  <text x="80" y="501" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2E7D32">applyStructuralEdit()</text>
  <text x="80" y="527" font-size="12.5" fill="#595959">조각을 확정 위치에 끼우고</text>
  <text x="80" y="549" font-size="12.5" fill="#595959">import·훅은 제자리 분배,</text>
  <text x="80" y="571" font-size="12.5" fill="#595959">diff 확인 카드 후 파일 반영</text>

  <!-- 요약 배너 -->
  <rect x="60" y="612" width="1330" height="56" rx="10" fill="#1F3864"/>
  <text x="725" y="648" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">8단계 중 모델(확률)은 단 1칸 — 나머지 전부가 결정론이라, 모델이 틀려도 ⑤·⑥이 걸러내고 파일은 깨지지 않는다</text>

  <!-- 실체 확인 푸터 -->
  <rect x="60" y="686" width="1330" height="96" rx="10" fill="#EAF4EB" stroke="#2E7D32" stroke-width="2"/>
  <text x="88" y="714" font-size="15" font-weight="bold" fill="#2E7D32">실체 확인</text>
  <text x="88" y="738" font-size="13" fill="#333333">· 파일·함수·라인 전부 실존: CodeSectionExtractor.ts · RegionEdit.ts · ScaffoldContracts.ts · RegionEditService.ts · ChatViewProvider.ts · StructuralAnchor.ts</text>
  <text x="88" y="762" font-size="13" fill="#333333">· 자동 테스트 상시 검증: npm run test:region-edit (220건) · eval:region — 회귀 0 (개선을 거듭해도 기존 테스트가 깨진 적 0건)</text>
</svg>

  <rect x="45" y="368" width="160" height="76" rx="8" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="125" y="398" text-anchor="middle" font-size="12" fill="#262626">「useApi 반환값이</text>
  <text x="125" y="416" text-anchor="middle" font-size="12" fill="#262626">뭐야?」</text>
  <text x="125" y="434" text-anchor="middle" font-size="10" fill="#7F7F7F">질문 (Q&amp;A)</text>

  <line x1="205" y1="406" x2="238" y2="406" stroke="#8FAADC" stroke-width="2" marker-end="url(#ar9)"/>

  <rect x="240" y="376" width="250" height="60" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="365" y="400" text-anchor="middle" font-size="12" fill="#404040">Q&amp;A로 분류</text>
  <text x="365" y="420" text-anchor="middle" font-size="10.5" fill="#7F7F7F">오답 비용 0 → 카드 불필요</text>

  <line x1="490" y1="406" x2="1148" y2="406" stroke="#8FAADC" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar9G)"/>
  <text x="820" y="394" text-anchor="middle" font-size="10.5" fill="#595959">카드·위저드 건너뛰고 직행 (지금과 동일)</text>

  <rect x="1150" y="368" width="280" height="86" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1290" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">지식문서 카드 렌더</text>
  <text x="1290" y="414" text-anchor="middle" font-size="11" fill="#404040">OfflineKnowledgeRetriever</text>
  <text x="1290" y="434" text-anchor="middle" font-size="10.5" fill="#7F7F7F">기존 오프라인 Q&amp;A 무변경</text>

  <!-- ═══ 행 3: 자연어 우회 입구 ═══ -->
  <rect x="45" y="506" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#595959" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="125" y="532" text-anchor="middle" font-size="12" fill="#262626">/ 슬래시 커맨드</text>
  <text x="125" y="550" text-anchor="middle" font-size="12" fill="#262626">런처 메뉴 · 팔레트</text>
  <text x="125" y="568" text-anchor="middle" font-size="10" fill="#7F7F7F">숙련자 입구</text>

  <line x1="205" y1="542" x2="848" y2="542" stroke="#8FAADC" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar9)"/>
  <text x="520" y="530" text-anchor="middle" font-size="10.5" fill="#595959">자연어 아예 건너뛰고 위저드 직접 진입 — 같은 위저드로 수렴</text>

  <rect x="850" y="512" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="980" y="537" text-anchor="middle" font-size="12" fill="#404040">위저드 직접 진입</text>
  <text x="980" y="557" text-anchor="middle" font-size="10.5" fill="#7F7F7F">두 입구 = 동일 카드·동일 실행기</text>

  <!-- ═══ 카탈로그 → 추천기 연결 ═══ -->
  <line x1="670" y1="666" x2="670" y2="610" stroke="#C55A11" stroke-width="2" marker-end="url(#ar9O)"/>
  <text x="684" y="644" font-size="10.5" fill="#C55A11">트리거 매칭 → 카드 상위 N장 공급</text>

  <!-- ═══ 하단: 카드 카탈로그 ═══ -->
  <rect x="30" y="668" width="1420" height="290" fill="#FBFBFB" stroke="#7F7F7F" stroke-width="1.5"/>
  <text x="50" y="698" font-size="16" font-weight="bold" fill="#1F3864">🗂 행동 카드 카탈로그 — 코드가 아니라 데이터 (엔진은 카드 내용을 모른다)</text>

  <!-- 3계층 -->
  <rect x="60" y="716" width="320" height="92" rx="8" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5"/>
  <text x="220" y="740" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#404040">① 내장 카드</text>
  <text x="220" y="760" text-anchor="middle" font-size="11" fill="#595959">익스텐션 번들 — scaffold 핵심</text>
  <text x="220" y="778" text-anchor="middle" font-size="10.5" fill="#7F7F7F">페이지 위저드 · API 바인딩 · 레시피</text>
  <text x="220" y="796" text-anchor="middle" font-size="10" fill="#7F7F7F">관리: Axiom</text>

  <rect x="400" y="716" width="320" height="92" rx="8" fill="#FDF0E7" stroke="#C55A11" stroke-width="2"/>
  <text x="560" y="740" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#C55A11">② 프로젝트 카드 ★</text>
  <text x="560" y="760" text-anchor="middle" font-size="11" fill="#595959">.axiom/actions/ — git 커밋 = 팀 공유</text>
  <text x="560" y="778" text-anchor="middle" font-size="10.5" fill="#7F7F7F">선임이 등록 → 팀 전체가 같은 추천</text>
  <text x="560" y="796" text-anchor="middle" font-size="10" fill="#7F7F7F">핫리로드 (_AUTHORING 방식 확장)</text>

  <rect x="740" y="716" width="300" height="92" rx="8" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5"/>
  <text x="890" y="740" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#404040">③ 개인 카드</text>
  <text x="890" y="760" text-anchor="middle" font-size="11" fill="#595959">globalStorage — 개인 취향</text>
  <text x="890" y="778" text-anchor="middle" font-size="10.5" fill="#7F7F7F">개인 스니펫 · 실험 카드</text>
  <text x="890" y="796" text-anchor="middle" font-size="10" fill="#7F7F7F">관리: 개인</text>

  <!-- 카드 스키마 -->
  <rect x="1060" y="712" width="370" height="140" rx="8" fill="#2B2B2B"/>
  <text x="1078" y="736" font-size="11" font-family="Consolas, monospace" fill="#9CDCFE">id: create-list-page</text>
  <text x="1078" y="754" font-size="11" font-family="Consolas, monospace" fill="#CE9178">triggers: [목록, 리스트, 테이블, 조회]</text>
  <text x="1078" y="772" font-size="11" font-family="Consolas, monospace" fill="#D4D4D4">slots: [domain, pageName←프리필]</text>
  <text x="1078" y="790" font-size="11" font-family="Consolas, monospace" fill="#D4D4D4">action: {type: template|recipe|doc}</text>
  <text x="1078" y="808" font-size="11" font-family="Consolas, monospace" fill="#D4D4D4">priority: 10</text>
  <text x="1078" y="836" font-size="10" fill="#8C8C8C">카드가 트리거·슬롯·행동을 스스로 선언</text>

  <!-- 관리 패널 / 플라이휠 -->
  <rect x="60" y="828" width="480" height="104" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="80" y="854" font-size="12.5" font-weight="bold" fill="#1F3864">🛠 관리 — "편집은 파일, 관리는 패널"</text>
  <text x="80" y="876" font-size="11" fill="#404040">· 목록 / 켜기·끄기 토글(삭제 대신 비활성화) / 새 카드 템플릿</text>
  <text x="80" y="894" font-size="11" fill="#404040">· 카드 lint (트리거 중복·슬롯 오류) — 등록 시점 검사</text>
  <text x="80" y="912" font-size="11" fill="#C55A11">· 드라이런: "이 카드가 어떤 질문에 뜨나" 미리보기</text>

  <rect x="560" y="828" width="560" height="104" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="580" y="854" font-size="12.5" font-weight="bold" fill="#2E7D32">🔄 채집 플라이휠 — 온라인 사용이 오프라인 자산을 만든다</text>
  <text x="580" y="876" font-size="11" fill="#404040">온라인 LLM 편집 성공(applied·미되돌림) 감지 → "카드로 저장할까요?" 제안</text>
  <text x="580" y="894" font-size="11" fill="#404040">→ 카탈로그가 팀의 실제 업무를 따라 성장 (RegionCaptureRecorder 재사용)</text>
  <text x="580" y="912" font-size="10" fill="#7F7F7F">반자동(수동 확인 경유) — 파일 전용 코드를 재사용 골격으로 추상화</text>

  <rect x="1140" y="864" width="290" height="68" rx="8" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1285" y="890" text-anchor="middle" font-size="11" font-weight="bold" fill="#404040">엔진은 프레임워크 중립</text>
  <text x="1285" y="910" text-anchor="middle" font-size="10.5" fill="#7F7F7F">지원은 React scaffold 전용 유지 · 미래 = 카드 팩</text>

  <!-- ═══ 푸터 ═══ -->
  <text x="30" y="990" font-size="11.5" fill="#595959">💡 오분류=사고 → 칩 하나 고치기. 경험은 "명령→메뉴"가 아니라 "명령→계획 확인" — 잘 맞으면 클릭 1번(Enter), 미리보기가 곧 사람 눈 검증 게이트.</text>
  <text x="1450" y="990" text-anchor="end" font-size="11" fill="#7F7F7F">상세: docs/offline-action-cards-plan.md</text>
</svg>

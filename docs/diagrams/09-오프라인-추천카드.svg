  <text x="545" y="158" font-size="11" font-weight="bold" fill="#C55A11">📄 목록 페이지 생성   ("목록·페이지"에서)</text>
  <rect x="545" y="168" width="70" height="22" rx="11" fill="#FDF0E7" stroke="#E8B48D"/>
  <text x="580" y="183" text-anchor="middle" font-size="10" fill="#262626">main ▾</text>
  <rect x="621" y="168" width="112" height="22" rx="11" fill="#FDF0E7" stroke="#E8B48D"/>
  <text x="677" y="183" text-anchor="middle" font-size="10" fill="#262626">EmployeeList ✎</text>
  <rect x="739" y="168" width="56" height="22" rx="11" fill="#FDF0E7" stroke="#E8B48D"/>
  <text x="767" y="183" text-anchor="middle" font-size="10" fill="#262626">list ▾</text>
  <text x="545" y="212" font-size="10.5" font-weight="bold" fill="#404040">만들어질 것:</text>
  <text x="557" y="230" font-size="10.5" font-family="Consolas, monospace" fill="#2E7D32">+ pages/EmployeeList.tsx (신규)</text>
  <text x="557" y="247" font-size="10.5" font-family="Consolas, monospace" fill="#C55A11">± router/index.tsx (경로 추가)</text>
  <rect x="545" y="258" width="136" height="26" rx="6" fill="#C55A11"/>
  <text x="613" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">⏎ 이대로 만들기</text>
  <rect x="691" y="258" width="104" height="26" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="743" y="275" text-anchor="middle" font-size="11" fill="#595959">다른 작업 ▾</text>
  <text x="670" y="302" text-anchor="middle" font-size="10" fill="#7F7F7F">확신 낮으면 컴팩트 리스트 · 오분류=칩 수정이면 끝</text>

  <!-- Enter 즉시 실행 경로 (위저드 생략) -->
  <path d="M810,146 L826,146 L826,128 L1290,128 L1290,142" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#ar9G)"/>
  <text x="1055" y="124" text-anchor="middle" font-size="10" fill="#2E7D32">⏎ 프리필 다 맞으면 위저드 생략, 즉시 실행</text>

  <line x1="810" y1="200" x2="848" y2="200" stroke="#8FAADC" stroke-width="2" marker-end="url(#ar9)"/>
  <text x="829" y="188" text-anchor="middle" font-size="9.5" fill="#595959">칩 클릭</text>

  <!-- 위저드 -->
  <rect x="850" y="146" width="260" height="150" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="980" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">QuickPick = 칩 편집기</text>
  <text x="868" y="194" font-size="11" fill="#404040">· 칩 클릭 → 그 슬롯만 고침</text>
  <text x="868" y="214" font-size="11" fill="#404040">· 프리필 다 맞으면 통째 생략</text>
  <text x="868" y="234" font-size="11" fill="#404040">· 맨땅 진입(/메뉴)만 순차 3단</text>
  <text x="980" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2E7D32">여기부터 자연어 해석 0</text>
  <text x="980" y="280" text-anchor="middle" font-size="10" fill="#7F7F7F">모델의 "판단 한 조각"을 사람이 대신</text>

  <line x1="1110" y1="200" x2="1148" y2="200" stroke="#2E7D32" stroke-width="2" marker-end="url(#ar9G)"/>

  <!-- 결정론 적용 -->
  <rect x="1150" y="146" width="280" height="150" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1290" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">템플릿 · structural apply</text>
  <text x="1168" y="194" font-size="11" fill="#404040">· page/router.template.txt 생성</text>
  <text x="1168" y="214" font-size="11" fill="#404040">· 라우터 자동 배선</text>
  <text x="1168" y="234" font-size="11" fill="#404040">· ✅ 완료 카드 + 다음 단계 버튼</text>
  <text x="1290" y="264" text-anchor="middle" font-size="10.5" fill="#2E7D32">[🔌 API 바인딩] [📚 문서] 로 연쇄</text>
  <text x="1290" y="284" text-anchor="middle" font-size="10" fill="#7F7F7F">결과가 항상 동일 (결정론)</text>


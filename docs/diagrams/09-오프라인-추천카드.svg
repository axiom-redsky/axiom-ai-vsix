  </defs>
  <rect width="1480" height="1010" fill="#FFFFFF"/>

  <!-- ═══ 제목 ═══ -->
  <text x="30" y="44" font-size="24" font-weight="bold" fill="#1F3864">오프라인 추천 카드 — 자연어의 역할을 "실행"에서 "추천"으로</text>
  <text x="1450" y="44" text-anchor="end" font-size="12" fill="#595959">행동은 카드 경유 · Q&amp;A는 직행 · 이 경로 전체 LLM 호출 0회</text>

  <!-- ═══ 외곽 프레임 + 레인 배경 ═══ -->
  <rect x="30" y="64" width="1420" height="540" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5"/>
  <rect x="30"   y="118" width="190" height="486" fill="#FAFAFA"/>

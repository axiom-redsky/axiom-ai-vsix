  <text x="125" y="198" text-anchor="middle" font-size="12" fill="#262626">만들어줘」</text>
  <text x="125" y="216" text-anchor="middle" font-size="10" fill="#7F7F7F">행동성 요청</text>

  <line x1="205" y1="188" x2="238" y2="188" stroke="#8FAADC" stroke-width="2" marker-end="url(#ar9)"/>

  <rect x="240" y="146" width="250" height="102" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="365" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">OfflineIntentResolver</text>
  <text x="365" y="188" text-anchor="middle" font-size="11" fill="#404040">기존 정규식 그대로 —</text>
  <text x="365" y="204" text-anchor="middle" font-size="11" fill="#404040">단, 바로 실행하지 않는다</text>
